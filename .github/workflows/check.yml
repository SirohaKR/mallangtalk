name: Check
on: [push, pull_request]
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: mallangtalk
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: mallangtalk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mallangtalk -d mallangtalk_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - run: dart pub get --enforce-lockfile
      - run: dart analyze
      - run: dart test
        env:
          TEST_DATABASE_URL: postgresql://mallangtalk:test_password@localhost:5432/mallangtalk_test?sslmode=disable
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.47.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn
