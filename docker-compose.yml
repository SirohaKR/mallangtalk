name: mallangtalk
services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-}
    restart: unless-stopped
    ports:
      - "${PORT:-5200}:80"
    depends_on:
      - api
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "5200"
      WEB_DIR: ""
      DATABASE_URL: "postgresql://mallangtalk:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/mallangtalk?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: mallangtalk
      POSTGRES_DB: mallangtalk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mallangtalk -d mallangtalk"]
      interval: 5s
      timeout: 5s
      retries: 12
  import:
    profiles: [tools]
    build: .
    environment:
      DATABASE_URL: "postgresql://mallangtalk:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/mallangtalk?sslmode=disable"
    volumes:
      - ./data/import:/backup:ro
    entrypoint: ["/app/import_sqlite", "/backup/mallangtalk.db"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
