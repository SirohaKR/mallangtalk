# [초보자 노트] 같은 폴더의 .env(키·접속 코드·포트)를 읽어서 말랑톡 서버를 켜요.
# 켜기: docker compose up -d --build   →   http://localhost:5200 (NAS면 http://NAS주소:5200)
# 포트를 바꾸려면 .env의 PORT만 고치면 돼요 (안 적으면 5200)
services:
  mallangtalk:
    build: .
    container_name: mallangtalk_server
    restart: unless-stopped
    ports:
      - "${PORT:-5200}:${PORT:-5200}"
    volumes:
      - ./data:/app/data # 다음 단계(DB 저장)에서 캐릭터·진행 상황을 여기에 저장
    env_file:
      - .env
