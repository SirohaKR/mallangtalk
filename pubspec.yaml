name: mallangtalk
description: UGC 캐릭터 톡 시뮬레이션 플랫폼 (플레이 + 제작 통합 웹앱)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  dio: ^5.7.0
  # 앱·서버가 같이 쓰는 AI 호출 코드
  mallangtalk_ai:
    path: packages/mallangtalk_ai
  shared_preferences: ^2.3.3
  file_picker: ^13.1.0
  # 웹에서 사진을 JPEG로 줄일 때 브라우저 canvas 사용
  web: ^1.1.1
  url_launcher: ^6.3.3
  # 사진 넣을 때 자르기·확대·이동 편집 화면 (웹 지원)
  crop_your_image: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/scenarios/
  # 한국어 기본 글꼴 (자주 쓰는 한글 2,350자만 담아서 가볍게. 없는 글자는 브라우저가 자동으로 보충)
  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-Regular.ttf
        - asset: assets/fonts/NotoSansKR-Bold.ttf
          weight: 700
